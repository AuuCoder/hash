[package]
name = "hash256-rust-worker"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
ocl = "0.19"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha3 = "0.10"

[target.'cfg(not(target_os = "macos"))'.dependencies]
cudarc = { version = "0.19.4", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "fallback-latest", "cuda-12080"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"
